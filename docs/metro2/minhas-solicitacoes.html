<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Requisições de Materiais · Metro II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__brand">
    <div class="app-header__logo" style="font-size:20px;font-weight:900;letter-spacing:-1px;">Rio+</div>
    <div>
      <h1>Requisições de Materiais</h1>
      <p class="app-header__subtitle">Minhas Solicitações</p>
    </div>
  </div>
</header>

<main class="app-main">
  <a href="index.html" class="link-secundario" style="margin-bottom:16px;">← Nova solicitação</a>

  <div class="grupo-campos">
    <legend>Consultar protocolo</legend>
    <label class="campo">
      <span>Número do protocolo</span>
      <input type="text" id="input-protocolo" placeholder="Ex: REQ-20260803-a1b2c3">
    </label>
    <button type="button" class="btn-enviar" id="btn-consultar">Consultar</button>
  </div>

  <div id="resultado-consulta"></div>

  <div class="grupo-campos" id="grupo-recentes">
    <legend>Consultadas neste aparelho</legend>
    <div id="lista-recentes"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
(function () {
  const STATUS_LABEL = {
    recebido: '📥 Recebido',
    em_analise: '🔍 Em análise',
    separando_material: '📦 Separando material',
    pronto_retirada: '✅ Pronto para retirada',
    concluido: '🏁 Concluído',
    cancelado: '❌ Cancelado'
  };

  const inputProtocolo = document.getElementById('input-protocolo');
  const btnConsultar = document.getElementById('btn-consultar');
  const resultadoDiv = document.getElementById('resultado-consulta');
  const listaRecentesDiv = document.getElementById('lista-recentes');

  function formatarCPF(cpf) {
    if (!cpf) return '—';
    const d = cpf.replace(/\D/g, '');
    if (d.length !== 11) return cpf;
    return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  }

  function renderComprovante(s) {
    const temComprovante = s.status === 'concluido' && s.id_externo;
    if (temComprovante) {
      return `
        <div style="background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 8px 24px rgba(0,61,103,0.14);text-align:center;margin-top:8px;">
          <div style="font-size:42px;margin-bottom:8px;">🏁</div>
          <h2 style="color:#1E8E5A;margin:0 0 4px;">Material entregue!</h2>
          <p style="color:#5B6B77;font-size:14px;margin:0 0 24px;">Protocolo: <strong>${s.protocolo}</strong></p>

          <div style="background:#F4F6F8;border-radius:14px;padding:20px;margin-bottom:20px;text-align:left;">
            <div style="font-size:12px;color:#5B6B77;text-transform:uppercase;font-weight:700;margin-bottom:4px;">Colaborador</div>
            <div style="font-size:18px;font-weight:800;color:#003D67;">${s.nome_completo || '—'}</div>
            <div style="font-size:14px;color:#5B6B77;margin-top:4px;">Matrícula: <strong>${s.matricula || '—'}</strong></div>
            <div style="font-size:14px;color:#5B6B77;">CPF: <strong>${formatarCPF(s.cpf)}</strong></div>
          </div>

          <div style="background:#003D67;border-radius:14px;padding:20px;">
            <div style="font-size:12px;color:#9FB8CC;text-transform:uppercase;font-weight:700;margin-bottom:8px;">Nº do documento de saída</div>
            <div style="font-size:42px;font-weight:900;color:#fff;letter-spacing:2px;"># ${s.id_externo}</div>
          </div>

          <p style="font-size:12px;color:#5B6B77;margin-top:16px;">
            Entregue em ${new Date(s.atendido_em || s.created_at).toLocaleString('pt-BR')}
          </p>
        </div>`;
    }

    return `
      <div class="grupo-campos" style="margin-top:8px;">
        <p><strong>Protocolo:</strong> ${s.protocolo}</p>
        <p><strong>Status:</strong> ${STATUS_LABEL[s.status] || s.status}</p>
        <p><strong>Enviado em:</strong> ${new Date(s.created_at).toLocaleString('pt-BR')}</p>
        ${s.status === 'concluido' && !s.id_externo
          ? '<p style="color:#5B6B77;font-size:13px;">✔ Concluído — comprovante sendo preparado pelo almoxarifado.</p>'
          : ''}
      </div>`;
  }

  async function consultar(protocolo) {
    resultadoDiv.innerHTML = '<p style="text-align:center;color:var(--cor-texto-suave)">Consultando...</p>';
    const { data, error } = await supabaseClient.rpc('consultar_protocolo', { p_protocolo: protocolo });

    if (error || !data || data.length === 0) {
      resultadoDiv.innerHTML = '<div class="aviso-erro">⚠️ Protocolo não encontrado. Verifique o número digitado.</div>';
      return;
    }

    resultadoDiv.innerHTML = renderComprovante(data[0]);
  }

  btnConsultar.addEventListener('click', () => {
    const valor = inputProtocolo.value.trim();
    if (valor) consultar(valor);
  });

  inputProtocolo.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btnConsultar.click();
  });

  function renderRecentes() {
    let lista = [];
    try { lista = JSON.parse(localStorage.getItem('meus_protocolos') || '[]'); } catch (e) {}

    if (lista.length === 0) {
      listaRecentesDiv.innerHTML = '<p style="color:var(--cor-texto-suave);font-size:14px">Nenhuma solicitação registrada neste aparelho ainda.</p>';
      return;
    }

    listaRecentesDiv.innerHTML = lista.map(item => `
      <div class="item-linha" style="cursor:pointer" data-protocolo="${item.protocolo}">
        <strong>${item.protocolo}</strong>
        <div class="campo-ajuda">${new Date(item.data).toLocaleString('pt-BR')}</div>
      </div>
    `).join('');

    listaRecentesDiv.querySelectorAll('[data-protocolo]').forEach(el => {
      el.addEventListener('click', () => {
        inputProtocolo.value = el.dataset.protocolo;
        consultar(el.dataset.protocolo);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  renderRecentes();
})();
</script>
</body>
</html>
