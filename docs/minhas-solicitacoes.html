<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Minhas Solicitações - Rio+ Saneamento</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__brand">
    <div class="app-header__logo">R+</div>
    <div>
      <h1>Minhas Solicitações</h1>
      <p class="app-header__subtitle">Consulte pelo protocolo recebido</p>
    </div>
  </div>
</header>

<main class="app-main">
  <a href="index.html" class="link-secundario" style="margin-bottom:16px;">← Nova solicitação</a>

  <div class="grupo-campos">
    <legend>Consultar protocolo</legend>
    <label class="campo">
      <span>Número do protocolo</span>
      <input type="text" id="input-protocolo" placeholder="Ex: REQ-20260803-a1b2c3">
    </label>
    <button type="button" class="btn-enviar" id="btn-consultar">Consultar</button>
  </div>

  <div id="resultado-consulta"></div>

  <div class="grupo-campos" id="grupo-recentes">
    <legend>Consultadas neste aparelho</legend>
    <div id="lista-recentes"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
(function () {
  const STATUS_LABEL = {
    recebido: '📥 Recebido',
    em_analise: '🔍 Em análise',
    separando_material: '📦 Separando material',
    pronto_retirada: '✅ Pronto para retirada',
    concluido: '🏁 Concluído',
    cancelado: '❌ Cancelado'
  };

  const inputProtocolo = document.getElementById('input-protocolo');
  const btnConsultar = document.getElementById('btn-consultar');
  const resultadoDiv = document.getElementById('resultado-consulta');
  const listaRecentesDiv = document.getElementById('lista-recentes');

  async function consultar(protocolo) {
    resultadoDiv.innerHTML = '<p style="text-align:center;color:var(--cor-texto-suave)">Consultando...</p>';
    const { data, error } = await supabaseClient.rpc('consultar_protocolo', { p_protocolo: protocolo });

    if (error || !data || data.length === 0) {
      resultadoDiv.innerHTML = '<div class="aviso-erro">⚠️ Protocolo não encontrado. Verifique o número digitado.</div>';
      return;
    }

    const s = data[0];
    const dataFormatada = new Date(s.created_at).toLocaleString('pt-BR');
    resultadoDiv.innerHTML = `
      <div class="grupo-campos">
        <legend>Resultado</legend>
        <p><strong>Protocolo:</strong> ${s.protocolo}</p>
        <p><strong>Status:</strong> ${STATUS_LABEL[s.status] || s.status}</p>
        <p><strong>Enviado em:</strong> ${dataFormatada}</p>
      </div>
    `;
  }

  btnConsultar.addEventListener('click', () => {
    const valor = inputProtocolo.value.trim();
    if (valor) consultar(valor);
  });

  function renderRecentes() {
    let lista = [];
    try { lista = JSON.parse(localStorage.getItem('meus_protocolos') || '[]'); } catch (e) {}

    if (lista.length === 0) {
      listaRecentesDiv.innerHTML = '<p style="color:var(--cor-texto-suave);font-size:14px">Nenhuma solicitação registrada neste aparelho ainda.</p>';
      return;
    }

    listaRecentesDiv.innerHTML = lista.map(item => `
      <div class="item-linha" style="cursor:pointer" data-protocolo="${item.protocolo}">
        <strong>${item.protocolo}</strong>
        <div class="campo-ajuda">${new Date(item.data).toLocaleString('pt-BR')}</div>
      </div>
    `).join('');

    listaRecentesDiv.querySelectorAll('[data-protocolo]').forEach(el => {
      el.addEventListener('click', () => {
        inputProtocolo.value = el.dataset.protocolo;
        consultar(el.dataset.protocolo);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  renderRecentes();
})();
</script>
</body>
</html>
